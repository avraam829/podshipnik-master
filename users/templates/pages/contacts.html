{% extends "base.html" %}

{% block title %}Контакты - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm contacts-card">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4">
                    <h1 class="mb-2">Контакты</h1>
                    <p class="text-muted mb-0">
                        Если у вас есть вопросы по товарам, наличию или заказу — напишите нам.
                    </p>
                </div>

                <div class="contact-box">
                    <div class="contact-icon">@</div>
                    <div>
                        <div class="contact-label">Электронная почта</div>
                        <a href="mailto:9857277106@mail.ru" class="contact-email">
                            9857277106@mail.ru
                        </a>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top">
                    <p class="mb-0 text-muted">
                        Мы стараемся отвечать максимально быстро.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.contacts-card {
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #fcfcfc 100%);
}

.contact-box {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 24px;
    border-radius: 16px;
    background: #fff8e8;
    border: 1px solid #ffe2a8;
}

.contact-icon {
    width: 58px;
    height: 58px;
    min-width: 58px;
    border-radius: 50%;
    background: #f4b400;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(244, 180, 0, 0.25);
}

.contact-label {
    font-size: 14px;
    color: #6c757d;
    margin-bottom: 6px;
}

.contact-email {
    font-size: 22px;
    font-weight: 700;
    color: #1f2937;
    text-decoration: none;
    word-break: break-word;
}

.contact-email:hover {
    color: #f4b400;
}
</style>
{% endblock %}
