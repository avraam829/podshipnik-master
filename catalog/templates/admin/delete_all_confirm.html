{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <h1 style="color: #d32f2f;">⚠️ Удаление всех товаров</h1>
    
    <div style="background: #ffebee; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <h3>Будет удалено:</h3>
        <ul style="font-size: 18px;">
            <li><strong>{{ total_products }}</strong> товаров</li>
            <li><strong>{{ total_stocks }}</strong> записей склада</li>
            <li><strong>{{ total_prices }}</strong> записей цен</li>
        </ul>
        <p style="color: #d32f2f; font-weight: bold;">
            Это действие необратимо!
        </p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="margin: 20px 0;">
            <label style="font-size: 16px;">
                <input type="checkbox" name="confirm" required>
                Я подтверждаю удаление всех товаров
            </label>
        </div>
        
        <div style="margin-top: 30px;">
            <button type="submit" 
                    style="background: #d32f2f; color: white; padding: 12px 30px; 
                           border: none; border-radius: 5px; font-size: 16px; 
                           cursor: pointer;">
                🗑️ Удалить всё
            </button>
            
            <a href="../" 
               style="margin-left: 20px; padding: 12px 30px; 
                      text-decoration: none; color: #333;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
